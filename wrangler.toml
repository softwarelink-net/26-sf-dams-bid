name = "allworld"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 共享多站点入口：通配子域由 allworld 托管；陕飞档案站点走同 Worker 内主机分流
[[routes]]
pattern = "*.softwarelink.net/*"
zone_name = "softwarelink.net"

[[routes]]
pattern = "26-sf-dams-bid.softwarelink.net"
custom_domain = true

[[routes]]
pattern = "softwarelink.net"
custom_domain = true

[[routes]]
pattern = "www.softwarelink.net"
custom_domain = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# allworld 多站点主机分流依赖 Worker 优先；sitemap 在 Worker 内走 Cache API 加速
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "Allworld"
database_id = "502e9e5d-e221-480c-a2a8-20c618fe7688"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "26-sf-dams-bid-assets"

[[r2_buckets]]
binding = "SITES"
bucket_name = "allworld-sites"

# 将 TTP 子域误入通配路由的请求转发到独立 Worker，避免 /api Not Found
[[services]]
binding = "TTP_SITE"
service = "26-ttp-test-bid"

[vars]
PROJECT_SLUG = "26-sf-dams-bid"
DEPLOYMENT_HOST = "https://26-sf-dams-bid.softwarelink.net/"
ROOT_DOMAIN = "softwarelink.net"
